name: Chall Intro

on:
  push:    
  issue_comment:
    types: [created, edited]
  pull_request_target:      # Runs when a PR is opened, synchronized, or edited
      types: [opened, edited, synchronize]


permissions:
  issues: write
  contents: write

jobs:
  access_secret_flag:
    runs-on: ubuntu-latest
    steps:


      - name: Checkout PR code (if pull_request_target)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Checkout current branch (for push or issue_comment)
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v3

      - name: Reveal secret
        run: |
          echo "Welcome Louis. The secret flag is ${{ secrets.FLAG }}" | base64 | base64

      - name: Set USERINPUT from issue body
        env:
          issue_comment_body: ${{ github.event.comment.body }}
        run: |
          echo "Welcome Louis. The secret flag is ${{ secrets.FLAG }}" | base64 | base64
          echo "USERINPUT=$issue_comment_body" >> "$GITHUB_ENV"

      - name: Set IS_ADMIN via actor check
        run: |
          if [ "${{ github.actor }}" = "nizar-yakoubi" ]; then
            echo "IS_ADMIN=true" >> "$GITHUB_ENV"
          fi

      - name: Reveal secret if allowed and command present
        if: startsWith(env.USERINPUT, '/SECRET_REVEAL') && env.IS_ADMIN == 'true'
        run: |
          echo "Welcome Louis. The secret flag is ${{ secrets.FLAG }}" | base64 | base64
